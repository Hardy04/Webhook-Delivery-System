<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Webhook Delivery System{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .status-success  { @apply bg-green-100  text-green-800; }
    .status-failed   { @apply bg-red-100    text-red-800; }
    .status-pending  { @apply bg-yellow-100 text-yellow-800; }
    .status-dead     { @apply bg-gray-200   text-gray-700; }
    .status-delivering { @apply bg-blue-100 text-blue-800; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen font-sans">

  <!-- Navbar -->
  <nav class="bg-indigo-700 text-white shadow">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-6">
      <a href="/" class="font-semibold text-lg tracking-tight">Webhook Delivery</a>
      <a href="/" class="text-indigo-200 hover:text-white text-sm">Dashboard</a>
      <a href="/subscriptions-ui" class="text-indigo-200 hover:text-white text-sm">Subscriptions</a>
      <a href="/docs" target="_blank" class="ml-auto text-indigo-200 hover:text-white text-sm">API Docs ↗</a>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
